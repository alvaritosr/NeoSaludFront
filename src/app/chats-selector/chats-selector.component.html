<ion-router-outlet id="main-content"></ion-router-outlet>

<ion-header>
  <ion-toolbar class="header2">
    <ion-img
      slot="start"
      src="assets/Higiea.png"
      class="header-icon"
      style="max-width: 10%; cursor: pointer;">
    </ion-img>
    <ion-title style="text-align: center">
      <h1>Buzon</h1>
    </ion-title>
    <ion-title slot="end">{{ nombreMedico }} ▼</ion-title>
  </ion-toolbar>
</ion-header>

<ion-header class="header2">
  <ion-toolbar>
    <ion-title slot="start">Selector de chat</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list class="chat-list">
    <ion-item [routerLink]="'/chat'" class="chat-card selected">
      <div class="chat-avatar">A</div>
      <div class="chat-info">
        <div class="chat-name">Ana López</div>
        <div class="chat-last-message">¿Qué tal todo? 😊</div>
      </div>
      <div class="chat-time">13:45</div>
    </ion-item>

    <ion-item [routerLink]="'/chat'" class="chat-card">
      <div class="chat-avatar">M</div>
      <div class="chat-info">
        <div class="chat-name">Miguel Ruiz</div>
        <div class="chat-last-message">Te envío el archivo ahora...</div>
      </div>
      <div class="chat-time">12:30</div>
    </ion-item>

  </ion-list>
</ion-content>
