<app-menu-superior></app-menu-superior>

<ion-toolbar>
  <ion-title>Pacientes ingresados</ion-title>
</ion-toolbar>

<ion-content>
  <ion-grid>
    <ion-row *ngFor="let room of rooms">
      <ion-col size="12">
        <h3>Habitación {{ room.number }}</h3>
      </ion-col>

      <ion-col size="3" *ngFor="let bed of room.beds">
        <ion-card [ngClass]="bed.severity">
          <ion-card-content class="ion-text-center">
            <ion-label><strong>Cama {{ bed.number }}</strong></ion-label>
            <br />
            <ion-label>Estado: {{ bed.status }}</ion-label>
            <br />
            <ion-label>Paciente: {{ bed.patient || '---' }}</ion-label>
            <br />
            <ion-label>Gravedad: {{ bed.severity }}</ion-label>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
