<app-menu-superior> </app-menu-superior>

<ion-toolbar>
  <ion-title>Chat con X</ion-title>
</ion-toolbar>

<ion-content>
  <div class="chat-container">
    <div *ngFor="let mensaje of mensajes" [ngClass]="{'align-right': mensaje.emisorId === userId, 'align-left': mensaje.emisorId !== userId}">
      <div class="mensaje">
        <p>{{ mensaje.contenido }}</p>
        <span class="fecha">{{ mensaje.fecha | date:'short' }}</span>
      </div>
    </div>
  </div>
</ion-content>
