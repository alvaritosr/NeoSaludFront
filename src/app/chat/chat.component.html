<ion-router-outlet id="main-content"></ion-router-outlet>

<ion-header>
  <ion-toolbar class="header2">
    <ion-img
      slot="start"
      src="assets/Higiea.png"
      class="header-icon"
      style="max-width: 10%; cursor: pointer;">
    </ion-img>
    <ion-title style="text-align: center">
      <h1>Buzon</h1>
    </ion-title>
    <ion-title slot="end">{{ nombreMedico }} ▼</ion-title>
  </ion-toolbar>
</ion-header>

<ion-header class="header2">
  <ion-toolbar>
    <ion-title slot="start">Chat con X</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card class="chat-bubble other">
          <ion-card-content>
            <ion-icon name="medkit-outline"></ion-icon>
            <div>Buenos días, ¿cómo van los pacientes en planta hoy?</div>
          </ion-card-content>
        </ion-card>

        <ion-card class="chat-bubble me">
          <ion-card-content>
            <ion-icon name="person-outline"></ion-icon>
            <div>Todo estable. El paciente de la habitación 203 ya se encuentra consciente.</div>
          </ion-card-content>
        </ion-card>

        <ion-card class="chat-bubble other">
          <ion-card-content>
            <ion-icon name="medkit-outline"></ion-icon>
            <div>Perfecto. ¿Le administraste el nuevo tratamiento?</div>
          </ion-card-content>
        </ion-card>

        <ion-card class="chat-bubble me">
          <ion-card-content>
            <ion-icon name="person-outline"></ion-icon>
            <div>Sí, a las 08:00h. Está respondiendo bien.</div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-footer>
    <ion-toolbar>
      <ion-input placeholder="Escribe un mensaje..." class="chat-input"></ion-input>
    </ion-toolbar>
  </ion-footer>
</ion-content>
