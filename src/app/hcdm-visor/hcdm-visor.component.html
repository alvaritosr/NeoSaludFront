<app-menu-superior> </app-menu-superior>

<ion-content>
  <ion-header>
    <ion-toolbar>
      <ion-title>Paciente: {{ nombrePaciente }} {{ apellidoPaciente }} {{ segundoApellidoPaciente }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="radiografia">
    <ion-card class="radiografia-card">
      <ion-list>
        <ion-item *ngFor="let radiografia of dicomFiles">
          <ion-label>
            <h2>{{ radiografia.descripcion }}</h2>
          </ion-label>
          <ion-button slot="end" (click)="cargarRadiografia(radiografia.nombreArchivo)">Ver</ion-button>
        </ion-item>
      </ion-list>
    </ion-card>

    <div class="dicom-viewer" style="margin-top: 20px;">
      <div>
        <div #dicomImage id="dicomImage" style="width:100%; height:470px; background-color: black;"></div>
      </div>
      <div class="zoom-controls">
        <div class="left-controls">
          <ion-button class="movButtons" (click)="zoomIn()">
            <ion-icon name="expand"></ion-icon>
          </ion-button>
          <ion-button class="movButtons" (click)="zoomOut()">
            <ion-icon name="contract"></ion-icon>
          </ion-button>
        </div>
        <div class="right-controls">
          <button class="movButtons2" (click)="moveImage(0, -40)">
            <ion-icon name="1"></ion-icon>
          </button>
          <button class="movButtons2" (click)="moveImage(0, 40)">
            <ion-icon name="4"></ion-icon>
          </button>
          <button class="movButtons2" (click)="moveImage(-40, 0)">
            <ion-icon name="2"></ion-icon>
          </button>
          <button class="movButtons2" (click)="moveImage(40, 0)">
            <ion-icon name="3"></ion-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
