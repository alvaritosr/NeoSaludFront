<app-menu-superior></app-menu-superior>

<ion-content>
  <div class="modal-container">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Vacunas del paciente</h2>
      </div>

      <ion-button expand="block" routerLink="/vacunas" style="margin-bottom: 20px;">
        Volver a vacunas
      </ion-button>

      <ion-list *ngIf="vacunas && vacunas.length > 0; else sinVacunas">
        <ion-item *ngFor="let v of vacunas">
          <ion-label>
            <h2>{{ v.vacuna.nombre }}</h2>
            <p><strong>Descripción:</strong> {{ v.vacuna.descripcion }}</p>
            <p><strong>Dosis:</strong> {{ v.dosis }}</p>
            <p><strong>Fecha administración:</strong> {{ v.fechaAdministracion | date:'short' }}</p>
          </ion-label>
          <ion-button color="danger" slot="end" (click)="eliminarVacuna(v.id)">
            Eliminar
          </ion-button>
        </ion-item>
      </ion-list>

      <ng-template #sinVacunas>
        <ion-item>
          <ion-label>No hay vacunas registradas para este paciente.</ion-label>
        </ion-item>
      </ng-template>
    </div>
  </div>
</ion-content>
