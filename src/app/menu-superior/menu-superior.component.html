<ion-header>
  <ion-toolbar class="header2">
    <ion-img
      slot="start"
      src="assets/Higiea.png"
      class="header-icon"
      style="max-width: 10%; cursor: pointer;"
      [routerLink]="'/home'">
    </ion-img>
    <ion-title style="text-align: center">
      <h1>Historia de Salud Digital AP</h1>
    </ion-title>
    <ion-title slot="end">
      {{ nombreMedico }}
      <ion-button style="--background: transparent" *ngIf="ajustesreportes" (click)="mostrarAjustes($event)">
        {{ popoverAbierto ? '▲' : '▼' }}
      </ion-button>
    </ion-title>
  </ion-toolbar>
</ion-header>
