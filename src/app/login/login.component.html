<ion-content>
  <div class="login-container">
    <div class="img">
      <ion-img src="assets/Logo.png" class="login-logo"></ion-img>
    </div>

    <ion-card>
      <ion-card-content>
        <ion-item>
          <ion-label position="floating">Usuario</ion-label>
          <div class="input-container">
            <ion-input type="text" [(ngModel)]="username" name="username" required></ion-input>
          </div>
        </ion-item>

        <ion-item class="password-item">
          <ion-label position="floating">Contraseña</ion-label>
          <div class="input-container">
            <ion-input [type]="passwordFieldType" [(ngModel)]="password" required></ion-input>
            <ion-icon
              slot="end"
              [name]="passwordFieldType === 'password' ? 'eye' : 'eye-off'"
              (click)="togglePasswordVisibility()"
              style="cursor: pointer;">
            </ion-icon>
          </div>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Unidad - Perfil</ion-label>
          <div class="input-container">
            <ion-input type="text" [(ngModel)]="medicalCenter" name="medicalCenter" required></ion-input>
          </div>
        </ion-item>

        <button expand="full" (click)="login()">Iniciar Sesión</button>
        <a [routerLink]="'/recuperar-contrasena'">
          ¿Has olvidado la contraseña?
        </a>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
