<ion-content>
  <div class="centrado">
    <div class="login-container">
      <div class="img">
        <ion-img src="assets/Logo.png" class="login-logo"></ion-img>
      </div>

      <form [formGroup]="loginForm" class="login-form">
        <ion-list class="lista">

          <ion-text class="username">Usuario</ion-text>
          <div class="contenedor1">
            <ion-input class="usernameInput" placeholder="Introduce tu usuario" fill="outline" formControlName="username"></ion-input>
          </div>

          <ion-text class="password">Contraseña</ion-text>
          <div class="contenedor2">
            <ion-input
              class="passwordInput"
              type="password"
              placeholder="Introduce tu contraseña"
              fill="outline"
              formControlName="password">
            </ion-input>
          </div>

          <ion-text class="unidad-perfil">Unidad-Perfil</ion-text>
          <div class="contenedor3">
            <ion-select
              class="unidadPerfilSelect"
              placeholder="Selecciona una opción"
              formControlName="unidadPerfil">
              <ion-select-option value="hospital1">Hospital Universitario Virgen del Rocío</ion-select-option>
              <ion-select-option value="hospital2">Hospital Universitario Virgen Macarena</ion-select-option>
              <ion-select-option value="hospital3">Hospital Universitario Virgen de Valme</ion-select-option>
              <ion-select-option value="hospital4">Hospital San Juan de Dios </ion-select-option>
            </ion-select>
          </div>

          <ion-button expand="block" (click)="doLogin()" color="dark">Iniciar Sesión</ion-button>

          <ion-button class="forgot-password" fill="clear" [routerLink]="'/recuperar'">¿Has olvidado la contraseña?</ion-button>        </ion-list>
      </form>
    </div>
  </div>
</ion-content>
