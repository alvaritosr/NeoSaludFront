<app-menu-superior></app-menu-superior>

<ion-toolbar>
  <ion-title id="calendar-title">Calendario Semanal</ion-title>
</ion-toolbar>

<ion-content>
  <ion-buttons>
    <ion-button (click)="moveWeek(-1)">Semana anterior</ion-button>
    <ion-button (click)="moveWeek(1)">Semana siguiente</ion-button>
  </ion-buttons>

  <ion-grid>
    <ion-row>
      <ion-col size="1"></ion-col>
      <ion-col *ngFor="let weekDate of weekDates" size="1">
        <strong>{{ weekDate.day }}</strong>
        <br />
        <small>{{ weekDate.date }}</small>
      </ion-col>
    </ion-row>
    <ion-row *ngFor="let hour of hours">
      <ion-col size="1">
        <strong>{{ hour }}</strong>
      </ion-col>
      <ion-col *ngFor="let weekDate of weekDates" size="1">
        <ion-card>
          <ion-card-content>
            <!-- Contenido -->
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
