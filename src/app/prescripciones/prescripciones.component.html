<app-menu-superior> </app-menu-superior>

<ion-content class="ion-padding">
  <div class="modal-container">
    <ion-card class="modal-card">
      <ion-card-header class="modal-header">
        <ion-card-title style="color: #D9534F" >Prescripción de fármacos</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="prescripcionForm" (ngSubmit)="onSubmit()">
          <ion-grid>
            <ion-item-divider>
              <ion-label>Datos del Prescriptor</ion-label>
            </ion-item-divider>
            <ion-row>
              <ion-col size="6">
                <ion-input formControlName="nombrePrescriptor" label="Nombre del Médico" labelPlacement="stacked" required></ion-input>
              </ion-col>
              <ion-col size="6">
                <ion-input formControlName="numeroColegiado" label="Número de Colegiado" labelPlacement="stacked" required></ion-input>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">
                <ion-input formControlName="especialidad" label="Especialidad" labelPlacement="stacked" required></ion-input>
              </ion-col>
              <ion-col size="6">
                <ion-input formControlName="firmaDigital" label="Firma Digital" labelPlacement="stacked" required></ion-input>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="12">
                <ion-input formControlName="contactoPrescriptor" label="Contacto del Prescriptor" labelPlacement="stacked" required></ion-input>
              </ion-col>
            </ion-row>

            <ion-item-divider>
              <ion-label>Datos del Fármaco</ion-label>
            </ion-item-divider>
            <ion-row>
              <ion-col size="6">
                <ion-input formControlName="nombreGenerico" label="Nombre Genérico" labelPlacement="stacked" required></ion-input>
              </ion-col>
              <ion-col size="6">
                <ion-input formControlName="nombreComercial" label="Nombre Comercial" labelPlacement="stacked" required></ion-input>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">
                <ion-input formControlName="concentracion" label="Concentración" labelPlacement="stacked" required></ion-input>
              </ion-col>
              <ion-col size="6">
                <ion-input formControlName="formaFarmaceutica" label="Forma Farmacéutica" labelPlacement="stacked" required></ion-input>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">
                <ion-input formControlName="viaAdministracion" label="Vía de Administración" labelPlacement="stacked" required></ion-input>
              </ion-col>
              <ion-col size="6">
                <ion-input formControlName="dosis" label="Dosis" labelPlacement="stacked" required></ion-input>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">
                <ion-input formControlName="frecuencia" label="Frecuencia" labelPlacement="stacked" required></ion-input>
              </ion-col>
              <ion-col size="6">
                <ion-input formControlName="duracionDias" type="number" label="Duración (días)" labelPlacement="stacked" required></ion-input>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="6">
                <ion-input formControlName="cantidadEnvases" type="number" label="Cantidad de Envases" labelPlacement="stacked" required></ion-input>
              </ion-col>
            </ion-row>

            <ion-item-divider>
              <ion-label>Datos de Emisión</ion-label>
            </ion-item-divider>
            <ion-row>
              <ion-col size="6">
                <ion-input formControlName="lugarEmision" label="Lugar de Emisión" labelPlacement="stacked" required></ion-input>
              </ion-col>
              <ion-col size="6">
                <ion-datetime formControlName="fechaEmision" label="Fecha de Emisión" labelPlacement="stacked" required></ion-datetime>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="12">
                <ion-textarea formControlName="indicacionesEspecificas" label="Indicaciones Específicas" labelPlacement="stacked" required></ion-textarea>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col size="12">
                <ion-textarea formControlName="notasAdicionales" label="Notas Adicionales" labelPlacement="stacked"></ion-textarea>
              </ion-col>
            </ion-row>

            <ion-row class="button-row">
              <ion-col class="ion-text-center">
                <ion-button type="submit" [disabled]="!prescripcionForm.valid" style="background: #D9534F; border: black solid 2px; border-radius: var(--border-radius)">Guardar Prescripción</ion-button>
                <ion-button type="button" (click)="prescripcionForm.reset()" style="--background: gray; color: white; border-radius: var(--border-radius)">Limpiar Formulario</ion-button>
                <ion-button type="button"  (click)="navigateToVerPrescripciones() " style="background: #D9534F; border: black solid 2px; border-radius: var(--border-radius)">Ver Todas las Prescripciones</ion-button>              </ion-col>
            </ion-row>
          </ion-grid>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
